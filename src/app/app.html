<app-header />
<main>
  <div class="grid grid-cols-12">
    <div class="col-span-3">
      <app-sidebar>
        @for (user of users; track user.id) {
        <li>
          <app-users [user]="user" (select)="onSelectUser($event)" />
        </li>
        }
      </app-sidebar>
    </div>
    <section class="bg-white dark:bg-gray-900 col-span-9">
      @if (getSelectedUser) {
      <app-tasks [name]="getSelectedUser?.name" [userId]="getSelectedUser?.id" />
      } @else {
      <div class="w-full overflow-hidden bg-white rounded-lg shadow-lg dark:bg-gray-800">
        <div class="py-5 text-center">
          <p class="block text-xl font-bold text-gray-800 dark:text-white">No user is selected</p>
          <span class="text-sm text-gray-700 dark:text-gray-200">Please, select a user</span>
        </div>
      </div>
      }
    </section>
  </div>
</main>
