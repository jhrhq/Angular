<div class="content-wrapper">{{"kebab case testing" | kebabCase}}</div>
<app-cart-summary></app-cart-summary>
<!--Frameworks-->
<div class="content-wrapper flex-col">
  <div>
    <app-frameworks></app-frameworks>
  </div>
</div>
<div class="content-wrapper flex-col">
  <div class="space-y-5">
    <div class="flex gap-2">
      <!--counter-->
      <div class="flex gap-2">
        <button class="font-bold py-2.5 px-3 bg-blue-300 rounded-md" (click)="counter('plus')">
          +
        </button>
        <span class="font-bold py-2.5 px-3 bg-blue-100 rounded-md"> {{count}} </span>
        <button class="font-bold py-2.5 px-3 bg-blue-300 rounded-md" (click)="counter('minus')">
          -
        </button>
      </div>
      <!--input-->
      <div class="flex flex-col">
        <input class="border rounded" type="text" (input)="handleEvent($event.type)" />
        <input class="border rounded" type="text" (change)="handleEvent($event.type)" />
        <input class="border rounded" type="text" (click)="handleEvent($event.type)" />
      </div>
    </div>
    <div class="flex gap-2">
      <!--select-->
      <div class="w-64">
        <select name="" id="" (mouseenter)="handleEvent($event.type)">
          <option vlaue="car">Car🚗</option>
          <option vlaue="car">House🏠</option>
          <option vlaue="car">Bike🚲</option>
        </select>
      </div>
      <app-select-status />
    </div>
    <!--toggle-->
    <div>
      <button class="font-bold py-2.5 px-3 bg-blue-50 rounded-md" [disabled]="enable">
        {{enable ? "Disabled" : "Enabled"}}
      </button>
      <button class="font-bold py-2.5 px-3 bg-blue-500 rounded-md" (click)="toggleEnable()">
        Toggle Disable
      </button>
    </div>
  </div>
  <!--components-->
  <div class="flex gap-4">
    <app-todo />
    <app-user-list />
  </div>

  <!--using common module-->
  <app-list />
</div>
