<h1 class="text-lg font-bold">
  Frameworks
  <span class="italic font-normal text-base font-serif">
    (passing props from parent to children)
  </span>
</h1>

<div class="flex gap-2">
  <input
    type="text"
    [value]="inputValue()"
    (change)="handleChange($event.target.value)"
    class="w-full py-3 pl-10 pr-4 text-gray-700 bg-white border rounded-md focus:border-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-40"
    placeholder="framework"
  />

  <button
    (click)="addValue()"
    class="px-6 py-2 font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-600 rounded-lg hover:bg-blue-500 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-80 cursor-pointer"
  >
    Add
  </button>
</div>

<ul>
  @for(framework of frameworks(); track framework){
  <app-framework
    [framework]="framework"
    (selectFramework)="onSelectedFramework($event)"
    (deleteFramework)="onDeleteFramework($event)"
  >
  </app-framework>
  }
</ul>

<div class="mt-4 py-2 px-3 bg-teal-100 border border-teal-100">
  <strong>Active Selection:</strong> {{ selectedFramework() }}
</div>

<div class="flex gap-2 mt-4">
  <button
    (click)="counter.increment()"
    class="px-6 py-2 font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-600 rounded-lg hover:bg-blue-500 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-80 cursor-pointer"
  >
    +
  </button>
  <span
    class="px-6 py-2 font-bold tracking-wide text-blue-500 capitalize transition-colors duration-300 transform bg-blue-100 rounded-lg hover:bg-blue-500 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-80 cursor-pointer"
  >
    {{counter.count()}}
  </span>
  <button
    (click)="counter.decrement()"
    class="px-6 py-2 font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-600 rounded-lg hover:bg-blue-500 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-80 cursor-pointer"
  >
    -
  </button>
</div>
