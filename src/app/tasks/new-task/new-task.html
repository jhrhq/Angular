  <div class="relative flex justify-center">
    <div
      class="fixed inset-0 z-10 overflow-y-auto"
      aria-labelledby="modal-title"
      role="dialog"
      aria-modal="true"
    >
      <div
        class="flex items-end justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0"
      >
        <span class="hidden sm:inline-block sm:h-screen sm:align-middle" aria-hidden="true"
          >&#8203;</span
        >

        <div
          class="relative inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl dark:bg-gray-900 sm:my-8 sm:w-full sm:max-w-sm sm:p-6 sm:align-middle"
        >
          <h3
            class="text-lg font-medium leading-6 text-gray-800 capitalize dark:text-white"
            id="modal-title"
          >
            Add task
          </h3>

          <form class="mt-4" (ngSubmit)="onSubmit()">
            <div class="mt-4">
              <label class="text-sm text-gray-700 dark:text-gray-200" for="title">Title</label>

              <div class="flex items-center mt-2 -mx-1">
                <input
                  type="text"
                  name="title"
                  id="title"
                  [(ngModel)]="enteredTitle"
                  class="flex-1 block h-10 px-4 mx-1 text-sm text-gray-700 bg-white border border-gray-200 rounded-md dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 focus:border-blue-400 focus:ring-blue-300 focus:ring-opacity-40 dark:focus:border-blue-300 focus:outline-none focus:ring"
                />
              </div>
            </div>

            <div class="mt-4">
              <label class="text-sm text-gray-700 dark:text-gray-200" for="summary">Summary</label>

              <div class="flex items-center mt-2 -mx-1">
                <input
                  type="text"
                  name="summary"
                  id="summary"
                  [(ngModel)]="enteredSummary"
                  class="flex-1 block h-10 px-4 mx-1 text-sm text-gray-700 bg-white border border-gray-200 rounded-md dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 focus:border-blue-400 focus:ring-blue-300 focus:ring-opacity-40 dark:focus:border-blue-300 focus:outline-none focus:ring"
                />
              </div>
            </div>

            <div class="mt-4">
              <label class="text-sm text-gray-700 dark:text-gray-200" for="due-date">Date</label>

              <div class="flex items-center mt-2 -mx-1">
                <input
                  type="date"
                  id="due-date"
                  name="due-date"
                  [(ngModel)]="enteredDate"
                  class="flex-1 block h-10 px-4 mx-1 text-sm text-gray-700 bg-white border border-gray-200 rounded-md dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 focus:border-blue-400 focus:ring-blue-300 focus:ring-opacity-40 dark:focus:border-blue-300 focus:outline-none focus:ring"
                />
              </div>
            </div>

            <div class="mt-4 sm:flex sm:items-center sm:-mx-2">
              <button
                (click)="onCancel()"
                type="button"
                class="w-full px-4 py-2 text-sm font-medium tracking-wide text-gray-700 capitalize transition-colors duration-300 transform border border-gray-200 rounded-md sm:w-1/2 sm:mx-2 dark:text-gray-200 dark:border-gray-700 dark:hover:bg-gray-800 hover:bg-gray-100 focus:outline-none focus:ring focus:ring-gray-300 focus:ring-opacity-40"
              >
                Cancel
              </button>

              <button
                type="submit"
                class="w-full px-4 py-2 mt-3 text-sm font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-600 rounded-md sm:mt-0 sm:w-1/2 sm:mx-2 hover:bg-blue-500 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-40"
              >
                Create
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</dialog>
