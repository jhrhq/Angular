<!-- todo.html -->
<div
  class="max-w-md mx-auto mt-6 bg-white shadow-xl rounded-xl overflow-hidden border border-slate-100"
>
  <!-- Header with Circle Check Icon -->
  <div
    class="bg-linear-to-r from-blue-600 to-indigo-600 px-6 py-4 flex justify-between items-center"
  >
    <div class="flex items-center gap-2">
      <!-- Tailwind v4 size utility + Direct Lucide directive binding -->
      <svg lucideCircleCheck class="size-5 text-white/90 block" strokeWidth="2.5"></svg>
      <h2 class="text-xl font-bold text-white">Tasks Manager</h2>
    </div>
    <span
      class="bg-white/20 text-white text-xs font-semibold px-2.5 py-1 rounded-full backdrop-blur-sm"
    >
      {{ activeCount() }} remaining
    </span>
  </div>

  <!-- Input section with Plus Icon -->
  <div class="p-4 border-b border-slate-100 bg-slate-50 flex gap-2">
    <input
      type="text"
      [value]="newTodoText()"
      (input)="updateText($event)"
      (keydown.enter)="addTodo()"
      placeholder="What needs to be done?"
      class="flex-1 px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 text-slate-800"
    />
    <button
      (click)="addTodo()"
      class="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors duration-150 shadow-sm flex items-center gap-1.5 cursor-pointer"
    >
      <svg lucidePlus class="size-4 block" strokeWidth="2.5"></svg>
      <span>Add</span>
    </button>
  </div>

  <!-- Filter tabs -->
  <div
    class="flex border-b border-slate-100 text-xs font-semibold text-slate-500 bg-slate-50/50 p-1"
  >
    <button
      (click)="changeFilter('all')"
      [class]="currentFilter() === 'all' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-800'"
      class="flex-1 py-2 text-center rounded-md transition-all cursor-pointer"
    >
      All ({{ todos().length }})
    </button>
    <button
      (click)="changeFilter('active')"
      [class]="currentFilter() === 'active' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-800'"
      class="flex-1 py-2 text-center rounded-md transition-all cursor-pointer"
    >
      Active
    </button>
    <button
      (click)="changeFilter('completed')"
      [class]="currentFilter() === 'completed' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-800'"
      class="flex-1 py-2 text-center rounded-md transition-all cursor-pointer"
    >
      Completed ({{ completedCount() }})
    </button>
  </div>

  <!-- Task items loop -->
  <ul class="divide-y divide-slate-100 p-2 max-h-80 overflow-y-auto">
    @for (item of filteredTodos(); track item.id) {
    <li
      class="flex items-center gap-3 p-3 hover:bg-slate-50 rounded-lg transition-colors duration-150 group"
    >
      <input
        type="checkbox"
        [id]="'todo-check-' + item.id"
        [checked]="item.completed"
        (change)="toggleTodo(item.id)"
        class="size-5 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer transition"
      />
      <label
        [htmlFor]="'todo-check-' + item.id"
        [class]="item.completed ? 'line-through text-slate-400 font-light' : 'text-slate-700 font-medium'"
        class="flex-1 select-none transition-all duration-200"
      >
        {{ item.text }}
      </label>

      <!-- Delete Button with Trash Icon -->
      <button
        (click)="deleteTodo(item.id)"
        class="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-red-500 rounded transition-all duration-150 cursor-pointer"
        title="Delete task"
      >
        <svg lucideTrash class="size-4 block" strokeWidth="2"></svg>
      </button>
    </li>
    } @empty {
    <li class="p-8 text-center text-slate-400 text-sm">No tasks found matching your filter.</li>
    }
  </ul>
</div>
