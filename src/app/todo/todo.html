<div
  class="max-w-md mx-auto mt-6 bg-white shadow-xl rounded-xl overflow-hidden border border-slate-100"
>
  <!-- Header with active task indicator -->
  <div
    class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-4 flex justify-between items-center"
  >
    <h2 class="text-xl font-bold text-white">Tasks Manager</h2>
    <span
      class="bg-white/20 text-white text-xs font-semibold px-2.5 py-1 rounded-full backdrop-blur-sm"
    >
      {{ activeCount() }} remaining
    </span>
  </div>

  <!-- Input section -->
  <div class="p-4 border-b border-slate-100 bg-slate-50 flex gap-2">
    <input
      type="text"
      [value]="newTodoText()"
      (input)="updateText($event)"
      (keydown.enter)="addTodo()"
      placeholder="What needs to be done?"
      class="flex-1 px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400"
    />
    <button
      (click)="addTodo()"
      class="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors duration-150 shadow-sm"
    >
      Add
    </button>
  </div>

  <!-- Filter tabs bar -->
  <div
    class="flex border-b border-slate-100 text-xs font-semibold text-slate-500 bg-slate-50/50 p-1"
  >
    <button
      (click)="changeFilter('all')"
      [class]="currentFilter() === 'all' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-800'"
      class="flex-1 py-2 text-center rounded-md transition-all"
    >
      All ({{ todos().length }})
    </button>
    <button
      (click)="changeFilter('active')"
      [class]="currentFilter() === 'active' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-800'"
      class="flex-1 py-2 text-center rounded-md transition-all"
    >
      Active
    </button>
    <button
      (click)="changeFilter('completed')"
      [class]="currentFilter() === 'completed' ? 'bg-white text-blue-600 shadow-sm' : 'hover:text-slate-800'"
      class="flex-1 py-2 text-center rounded-md transition-all"
    >
      Completed ({{ completedCount() }})
    </button>
  </div>

  <!-- Task items loop -->
  <ul class="divide-y divide-slate-100 p-2 max-h-80 overflow-y-auto">
    @for (item of filteredTodos(); track item.id) {
    <li
      class="flex items-center space-x-3 p-3 hover:bg-slate-50 rounded-lg transition-colors duration-150 group"
    >
      <input
        type="checkbox"
        [checked]="item.completed"
        (change)="toggleTodo(item.id)"
        class="w-5 h-5 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer transition"
      />
      <span
        [class]="item.completed ? 'line-through text-slate-400 font-light' : 'text-slate-700 font-medium'"
        class="flex-1 select-none transition-all duration-200"
      >
        {{ item.text }}
      </span>

      <!-- Delete Button (Visible on item hover via Tailwind group rule) -->
      <button
        (click)="deleteTodo(item.id)"
        class="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-red-500 rounded transition-all duration-150"
        title="Delete task"
      >
        <svg
          xmlns="http://w3.org"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
          />
        </svg>
      </button>
    </li>
    } @empty {
    <li class="p-8 text-center text-slate-400 text-sm">No tasks found matching your filter.</li>
    }
  </ul>
</div>
