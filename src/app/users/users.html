<button

  class="flex items-center px-4 py-2 text-gray-700 w-full bg-gray-100 rounded-lg dark:bg-gray-800 dark:text-gray-200 cursor-pointer"
>
  <img
    class="object-cover size-8 rounded-full cursor-pointer"
    src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=634&q=80"
    alt="avatar"
  />
  <span class="mx-4 font-medium">{{ user.name }}</span>
</button>
