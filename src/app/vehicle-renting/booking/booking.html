<div class="max-w-5xl mx-auto p-6 space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Create Booking</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">
      Select customer and booking dates for vehicle rental
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Vehicle Summary Card -->
    <div
      class="lg:col-span-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 space-y-4 shadow-sm h-fit"
    >
      <div
        class="aspect-video bg-slate-100 dark:bg-slate-800 rounded-lg flex items-center justify-center text-4xl"
      >
        🚘
      </div>
      <div>
        <span
          class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-950/70 dark:text-indigo-400"
          >EV SUV</span
        >
        <h2 class="text-lg font-bold text-slate-900 dark:text-white mt-2">BMW iX xDrive50</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">Reg: NY-4820-EX</p>
      </div>

      <div class="border-t border-b border-slate-200 dark:border-slate-800 py-3 space-y-2 text-xs">
        <div class="flex justify-between text-slate-600 dark:text-slate-400">
          <span>Daily Rate</span>
          <span class="font-semibold text-slate-900 dark:text-white">$120.00 / day</span>
        </div>
        <div class="flex justify-between text-slate-600 dark:text-slate-400">
          <span>Seats & Fuel</span>
          <span class="font-semibold text-slate-900 dark:text-white">5 Seats • Electric</span>
        </div>
      </div>

      <!-- Price Calculator Box -->
      <div class="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-lg space-y-2">
        <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
          <span>Duration (3 days)</span>
          <span>$360.00</span>
        </div>
        <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
          <span>Insurance Cover</span>
          <span>$30.00</span>
        </div>
        <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
          <span>Taxes & Fees</span>
          <span>$25.00</span>
        </div>
        <div
          class="border-t border-slate-200 dark:border-slate-700 pt-2 flex justify-between text-sm font-bold text-slate-900 dark:text-white"
        >
          <span>Total Amount</span>
          <span class="text-indigo-600 dark:text-indigo-400">$415.00</span>
        </div>
      </div>
    </div>

    <!-- Booking Form -->
    <div
      class="lg:col-span-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 space-y-6 shadow-sm"
    >
      <h3
        class="text-md font-semibold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-3"
      >
        Booking Details
      </h3>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
            >Select Customer</label
          >
          <select
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500"
          >
            <option>John Doe (ID: CUST-1049)</option>
            <option>Sarah Jenkins (ID: CUST-1082)</option>
            <option>Michael Smith (ID: CUST-2031)</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
              >Pick-up Date & Time</label
            >
            <input
              type="datetime-local"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
              >Return Date & Time</label
            >
            <input
              type="datetime-local"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
            >Pick-up Location</label
          >
          <input
            type="text"
            value="JFK Airport Terminal 4 Branch"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
            >Payment Method</label
          >
          <div class="grid grid-cols-3 gap-3">
            <button
              type="button"
              class="py-2.5 border-2 border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-400 text-xs font-semibold rounded-lg text-center"
            >
              Credit Card
            </button>
            <button
              type="button"
              class="py-2.5 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-lg text-center hover:bg-slate-50 dark:hover:bg-slate-800"
            >
              Cash
            </button>
            <button
              type="button"
              class="py-2.5 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-lg text-center hover:bg-slate-50 dark:hover:bg-slate-800"
            >
              Ledger Balance
            </button>
          </div>
        </div>

        <div class="pt-4 flex justify-end gap-3">
          <button
            type="button"
            class="px-5 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg"
          >
            Cancel
          </button>
          <button
            type="button"
            class="px-6 py-2.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md transition"
          >
            Confirm & Book Now
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
