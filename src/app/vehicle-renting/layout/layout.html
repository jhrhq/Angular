<div
  class="min-h-screen bg-[#F8FAFC] dark:bg-[#0B1121] text-slate-900 dark:text-slate-100 flex flex-col md:flex-row font-sans selection:bg-indigo-500/30 transition-colors duration-300"
>
  <!-- Mobile Top Bar (Glassmorphic) -->
  <header
    class="md:hidden flex items-center justify-between p-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200/60 dark:border-slate-800/60 sticky top-0 z-30"
  >
    <div class="flex items-center space-x-3">
      <div
        class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white flex items-center justify-center shadow-[0_4px_12px_-2px_rgba(79,70,229,0.4)]"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          ></path>
        </svg>
      </div>
      <span class="font-extrabold text-slate-900 dark:text-white text-xl tracking-tight"
        >DriveFlow</span
      >
    </div>

    <div class="flex items-center space-x-1">
      <button
        type="button"
        class="p-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          ></path>
        </svg>
      </button>
      <button
        type="button"
        class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Sidebar Navigation -->
  <aside
    class="w-full md:w-[280px] bg-white dark:bg-slate-900 border-r border-slate-200/60 dark:border-slate-800/60 flex-shrink-0 flex flex-col justify-between hidden md:flex sticky top-0 h-screen z-20 transition-colors duration-300"
  >
    <div>
      <!-- Brand Logo Header -->
      <div class="h-20 flex items-center space-x-3.5 px-7">
        <div
          class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white flex items-center justify-center shadow-[0_4px_16px_-4px_rgba(79,70,229,0.5)]"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            ></path>
          </svg>
        </div>
        <div class="flex flex-col">
          <h1
            class="font-extrabold text-slate-900 dark:text-white text-xl tracking-tight leading-tight"
          >
            DriveFlow
          </h1>
          <span class="text-[11px] font-bold tracking-[0.2em] text-indigo-500 uppercase"
            >Fleet Manager</span
          >
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="px-4 py-6 space-y-1.5 text-[15px] font-medium">
        <p
          class="px-3 text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3 mt-2"
        >
          Overview
        </p>

        <!-- Dashboard -->
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-indigo-600 text-white shadow-[0_4px_20px_-4px_rgba(79,70,229,0.4)] dark:shadow-[0_4px_20px_-4px_rgba(79,70,229,0.3)] font-semibold"
          class="group flex items-center space-x-3 px-3.5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 hover:text-indigo-600 dark:hover:text-indigo-300 transition-all duration-200"
        >
          <svg
            class="w-5 h-5 opacity-75 group-hover:opacity-100 transition-opacity"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"

          </svg>

        </a>

        <p
          class="px-3 text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3 mt-8"
        >
          Fleet & Operations
        </p>

        <!-- Vehicle Listing -->
        <a
          routerLink="/vehicles"
          routerLinkActive="bg-indigo-600 text-white shadow-[0_4px_20px_-4px_rgba(79,70,229,0.4)] font-semibold"
          class="group flex items-center space-x-3 px-3.5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 hover:text-indigo-600 dark:hover:text-indigo-300 transition-all duration-200"
        >
          <svg
            class="w-5 h-5 opacity-75 group-hover:opacity-100"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
            ></path>
          </svg>
          <span>Vehicle Listing</span>
        </a>

        <!-- Add Vehicle -->
        <a
          routerLink="/vehicles/create"
          routerLinkActive="bg-indigo-600 text-white shadow-[0_4px_20px_-4px_rgba(79,70,229,0.4)] font-semibold"
          class="group flex items-center space-x-3 px-3.5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 hover:text-indigo-600 dark:hover:text-indigo-300 transition-all duration-200"
        >
          <svg
            class="w-5 h-5 opacity-75 group-hover:opacity-100"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            ></path>
          </svg>
          <span>Add Vehicle</span>
        </a>

        <!-- Book Vehicle -->
        <a
          routerLink="/book"
          routerLinkActive="bg-indigo-600 text-white shadow-[0_4px_20px_-4px_rgba(79,70,229,0.4)] font-semibold"
          class="group flex items-center space-x-3 px-3.5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 hover:text-indigo-600 dark:hover:text-indigo-300 transition-all duration-200"
        >
          <svg
            class="w-5 h-5 opacity-75 group-hover:opacity-100"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
            ></path>
          </svg>
          <span>Book Vehicle</span>
        </a>

        <!-- Booking Listing -->
        <a
          routerLink="/bookings"
          routerLinkActive="bg-indigo-600 text-white shadow-[0_4px_20px_-4px_rgba(79,70,229,0.4)] font-semibold"
          class="group flex items-center space-x-3 px-3.5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 hover:text-indigo-600 dark:hover:text-indigo-300 transition-all duration-200"
        >
          <svg
            class="w-5 h-5 opacity-75 group-hover:opacity-100"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
            ></path>
          </svg>
          <span>Booking Listing</span>
        </a>

        <!-- Customer Ledger -->
        <a
          routerLink="/ledger"
          routerLinkActive="bg-indigo-600 text-white shadow-[0_4px_20px_-4px_rgba(79,70,229,0.4)] font-semibold"
          class="group flex items-center space-x-3 px-3.5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 hover:text-indigo-600 dark:hover:text-indigo-300 transition-all duration-200"
        >
          <svg
            class="w-5 h-5 opacity-75 group-hover:opacity-100"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path

              stroke-linejoin="round"

            ></path>
          </svg>
          <span>Customer Ledger</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar Bottom / User Badge -->
    <div class="p-4 mb-2">
      <div
        class="flex items-center justify-between p-3 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-700/50 shadow-sm hover:shadow-md transition-shadow"
      >
        <div class="flex items-center space-x-3">
          <img
            src="https://i.pravatar.cc/150?img=11"
            alt="User Avatar"
            class="w-10 h-10 rounded-full ring-2 ring-white dark:ring-slate-800 shadow-sm object-cover"
          />
          <div>
            <p class="text-sm font-bold text-slate-900 dark:text-white leading-none">
              Tafhim Hasan
            </p>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Administrator</p>
          </div>
        </div>
        <a
          routerLink="/login"
          title="Logout"
          class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-xl transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            ></path>
          </svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main Work Area -->
  <div class="flex-1 flex flex-col min-w-0 min-h-screen relative">
    <!-- Top-level subtle background decoration -->
    <div
      class="absolute top-0 left-0 right-0 h-96 bg-gradient-to-b from-indigo-50/50 to-transparent dark:from-indigo-900/10 dark:to-transparent pointer-events-none z-0"
    ></div>

    <!-- Desktop Header (Glassmorphic) -->
    <header
      class="hidden md:flex items-center justify-between h-20 px-8 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border-b border-slate-200/60 dark:border-slate-800/60 sticky top-0 z-10"
    >
      <!-- Global Quick Search -->
      <div class="w-96 relative group">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
          <svg
            class="w-4 h-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
        <input
          type="text"
          placeholder="Search vehicles, bookings, clients..."
          class="w-full pl-10 pr-12 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 transition-all shadow-sm"
        />
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <kbd
            class="hidden sm:inline-block border border-slate-200 dark:border-slate-600 rounded-md px-2 py-0.5 text-[10px] font-semibold text-slate-400 bg-white dark:bg-slate-800"
            >/</kbd
          >
        </div>
      </div>

      <!-- Right Header Tools -->
      <div class="flex items-center space-x-5">
        <!-- System Status Badge -->
        <span
          class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200/60 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20 shadow-sm"
        >
          <span
            class="w-2 h-2 rounded-full bg-emerald-500 mr-2 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse"
          ></span>
          System Live
        </span>

        <div class="h-6 w-px bg-slate-200 dark:bg-slate-700"></div>

        <div class="flex items-center space-x-2">
          <!-- Theme Toggle -->
          <button
            type="button"
            class="p-2.5 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 rounded-xl transition-all"
            title="Toggle Theme"
          >
            <svg
              class="w-5 h-5 hidden dark:block"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              ></path>
            </svg>
            <svg
              class="w-5 h-5 block dark:hidden"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              ></path>
            </svg>
          </button>

          <!-- Notifications -->
          <button
            type="button"
            class="relative p-2.5 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 rounded-xl transition-all"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
              ></path>
            </svg>
            <span
              class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-rose-500 border-2 border-white dark:border-slate-900"
            ></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Central Routing Outlet -->
    <main class="flex-1 p-6 lg:p-10 z-10">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
