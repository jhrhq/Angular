    class="relative hidden lg:flex lg:w-1/2 bg-slate-950 items-center justify-center overflow-hidden"

    <!-- Modern Mesh Gradient Background -->
    <div

    <div
      class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')] [mask-image:linear-gradient(to_bottom_right,white,transparent)]"

    <div class="relative z-10 max-w-lg p-12">
      <div class="flex items-center gap-2 mb-12 text-white">
        <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          ></path>
        </svg>
        <span class="text-xl font-bold tracking-wide">PULSEFLOW</span>
      </div>
      <h1 class="text-4xl font-bold text-white tracking-tight mb-6 leading-tight">
        Manage your premium fleet with precision.
      </h1>
      <p class="text-slate-400 text-lg">
        Experience real-time telemetry, exclusive vehicle allocation, and seamless team
        collaboration in one unified workspace.
      </p>
    </div>
  </div>

  <div class="flex w-full lg:w-1/2 items-center justify-center p-8 sm:p-12 lg:p-24">

        <p class="text-sm text-gray-500">
          Don't have an account?
          <a href="#" class="font-semibold text-blue-600 hover:text-blue-500 transition-colors"
            >Request an invite</a
          >
        </p>
      </div>

      <!-- Credential Form -->
      <form class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Work Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg
                class="h-5 w-5 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                ></path>
              </svg>
            </div>
            <input
              type="email"
              class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl bg-gray-50/50 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm"
              placeholder="name@company.com"
            />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <a
              href="#"
              class="text-sm font-medium text-blue-600 hover:text-blue-500 transition-colors"
              >Forgot password?</a
            >
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg
                class="h-5 w-5 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </div>
            <input
              type="password"
              class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl bg-gray-50/50 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm"
              placeholder="••••••••"
            />
          </div>
        </div>

        <button
          type="button"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all mt-6"
        >
          Sign In to Workspace
        </button>
      </form>
    </div>
  </div>
</div>
