<div
  class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4 transition-colors"
>
  <div
    class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl p-8 space-y-6"
  >
    <!-- Header -->
    <div class="text-center space-y-2">
      <div
        class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white font-bold text-xl shadow-lg shadow-indigo-500/30"
      >
        🚗
      </div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
        DriveFlow Portal
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Enter your credentials to access vehicle management
      </p>
    </div>

    <!-- Login Form -->
    <form class="space-y-4">
      <div>
        <label
          class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2"
          >Email Address</label
        >
        <input
          type="email"
          placeholder="admin@driveflow.com"
          value="admin@driveflow.com"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition"
        />
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label
            class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider"
            >Password</label
          >
          <a
            href="#"
            class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline"
            >Forgot?</a
          >
        </div>
        <input
          type="password"
          value="••••••••"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition"
        />
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input
            type="checkbox"
            checked
            class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 dark:border-slate-700 dark:bg-slate-800"
          />
          <span class="text-xs text-slate-600 dark:text-slate-400">Remember me</span>
        </label>
      </div>

      <button
        type="button"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-medium text-sm rounded-lg shadow-md transition-all"
      >
        Sign In
      </button>
    </form>

    <div
      class="p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-lg text-xs text-amber-800 dark:text-amber-300 text-center"
    >
      💡 <strong>POC Demo Mode:</strong> Click <i>Sign In</i> to enter dashboard.
    </div>
  </div>
</div>
